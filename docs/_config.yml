title: Bitácora CSDT — Social Neighborhood Front-End
description: >-
  Informe de Deuda Técnica y Bitácora del proyecto Social Neighborhood Front-End.
  Análisis de arquitectura, calidad, CI y prácticas de desarrollo.

remote_theme: just-the-docs/just-the-docs@v0.10.0

url: "https://csdt-eci.github.io"
baseurl: "/social-neighborhood-front-end"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Just the Docs settings
color_scheme: default
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

# Aux links
aux_links:
  "Ver en GitHub":
    - "https://github.com/CSDT-ECI/social-neighborhood-front-end"

aux_links_new_tab: true

# Footer
footer_content: >-
  Juan Camilo Posso Guevara &bull; Juan Sebastian Buitrago Piñeros &bull;
  Richard Santiago Urrea Garcia &mdash;
  <a href="https://www.escuelaing.edu.co/es/">Escuela Colombiana de Ingeniería Julio Garavito</a>

back_to_top: true
back_to_top_text: "Volver arriba"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

# Exclude from build
exclude:
  - node_modules/
  - build/
  - "*.js"
  - "*.json"
  - "*.xml"
  - Gemfile
  - Gemfile.lock
  - pom.xml
  - storage.rules
  - firebase.json
  - .firebaserc
  - sonar-project.properties
  - suma.js
  - suma.test.js
  - public/
  - src/
